<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f9" />
    <title>کارگاه — برنامه‌ریزی شخصی</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <rect x="16" y="18" width="32" height="30" rx="8.5" stroke="currentColor" stroke-width="3.4" />
              <path d="M23 34.5l5.2 5.2L41.5 25" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div>
            <h1>کارگاه</h1>
            <p class="brand-sub" id="today-line"></p>
          </div>
        </div>

        <nav class="tabs" id="tabs" aria-label="بخش‌ها">
          <span class="tab-glow" id="tab-glow" aria-hidden="true"></span>
          <button type="button" class="tab" data-tab="daily">روزمره</button>
          <button type="button" class="tab" data-tab="buy">خرید</button>
          <button type="button" class="tab" data-tab="projects">پروژه‌ها</button>
          <button type="button" class="tab" data-tab="finance">مالی</button>
        </nav>
      </header>

      <main id="view"></main>

      <footer class="foot">
        <span>کارها و حساب‌وکتابت در حساب ابری‌ات ذخیره می‌شوند و قیمت‌ها خودکار از ترب خوانده می‌شوند.</span>
        <span class="account-line" id="account-line" hidden>
          <span id="account-email" dir="ltr"></span>
          <button type="button" class="link-btn" id="logout-btn">خروج</button>
        </span>
      </footer>
    </div>

    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div class="gate" id="gate" hidden>
      <form class="gate-card" id="gate-form" autocomplete="on">
        <span class="brand-mark gate-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="16" y="18" width="32" height="30" rx="8.5" stroke="currentColor" stroke-width="3.4" />
            <path d="M23 34.5l5.2 5.2L41.5 25" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <h2>ورود به کارگاه</h2>
        <p class="muted">با یک حساب، کارها و قیمت‌هایت روی هر دستگاهی در دسترس است.</p>

        <label class="gate-field">
          <span>ایمیل</span>
          <input id="gate-email" type="email" dir="ltr" required autocomplete="email" />
        </label>

        <label class="gate-field">
          <span>گذرواژه</span>
          <input id="gate-pass" type="password" dir="ltr" required minlength="6" autocomplete="current-password" />
        </label>

        <p class="gate-error" id="gate-error" hidden></p>

        <div class="gate-actions">
          <button type="submit" class="btn primary">ورود</button>
          <button type="button" class="btn ghost" id="gate-signup">ساخت حساب</button>
        </div>

        <button type="button" class="link-btn gate-skip" id="gate-skip">
          بدون حساب ادامه بده (فقط همین دستگاه)
        </button>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
