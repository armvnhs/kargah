<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eaf0" />
    <title>کارگاه — مدیریت مال و زندگی</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="side-brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H18a2 2 0 0 1 2 2v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17Z" />
              <path d="M4 9.5h13.5a1.5 1.5 0 0 1 1.5 1.5v4.5" />
              <circle cx="16" cy="14" r="1.2" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <div class="brand-text">
            <strong>کارگاه</strong>
            <span>مدیریت مال و زندگی</span>
          </div>
          <button type="button" class="icon-btn side-collapse" data-act="collapse" aria-label="جمع کردن منو">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M14 8l-4 4 4 4M18 8l-4 4 4 4" />
            </svg>
          </button>
        </div>

        <div class="side-search-wrap">
          <label class="side-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" />
            </svg>
            <input id="side-search" type="search" placeholder="جستجو…" autocomplete="off" aria-label="جستجو" />
          </label>
          <div class="search-pop" id="search-results" hidden></div>
        </div>

        <nav class="nav" id="tabs" aria-label="بخش‌ها">
          <button type="button" class="nav-item" data-tab="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" />
              <rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="2" />
            </svg>
            داشبورد
          </button>
          <button type="button" class="nav-item" data-tab="finance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19V5M4 19h16" /><path d="M8 19v-6M12.5 19V8M17 19v-4M21 19V6" />
            </svg>
            مالی
          </button>
          <button type="button" class="nav-item" data-tab="daily">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="5" width="16" height="15" rx="3.5" /><path d="M8 3.5v3M16 3.5v3M4 10h16M9 14.5l1.8 1.8 3.7-3.6" />
            </svg>
            روزمره
          </button>
          <button type="button" class="nav-item" data-tab="buy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8h12l-1 11.5a1.5 1.5 0 0 1-1.5 1.4h-7A1.5 1.5 0 0 1 7 19.5Z" /><path d="M9.5 8V6.5a2.5 2.5 0 0 1 5 0V8" />
            </svg>
            خرید و قیمت
          </button>
          <button type="button" class="nav-item" data-tab="projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z" />
            </svg>
            پروژه‌ها
          </button>
          <button type="button" class="nav-item" data-tab="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-2.7 1.1 1.9 1.9 0 1 1-3.8 0 1.6 1.6 0 0 0-2.7-1.1l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1A1.6 1.6 0 0 0 3.9 13a1.9 1.9 0 1 1 0-3.8 1.6 1.6 0 0 0 1.1-2.7l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1A1.6 1.6 0 0 0 10.4 2.7a1.9 1.9 0 1 1 3.8 0 1.6 1.6 0 0 0 2.7 1.1l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0 1.1 2.7 1.9 1.9 0 1 1 0 3.8 1.6 1.6 0 0 0-1.3 1.5Z" />
            </svg>
            تنظیمات
          </button>
        </nav>

        <div class="side-foot">
          <div class="privacy">
            <div class="privacy-text">
              <strong>مخفی کردن مبالغ</strong>
              <span>جای عدد، ستاره نشان بده</span>
            </div>
            <button type="button" class="switch" id="privacy-switch" data-act="toggle-privacy" aria-pressed="false" aria-label="مخفی کردن مبالغ">
              <span></span>
            </button>
          </div>

          <div class="user-card" id="account-line" hidden>
            <span class="avatar" aria-hidden="true">ک</span>
            <div class="user-info">
              <strong id="account-email" dir="ltr"></strong>
              <span>حساب ابری</span>
            </div>
            <button type="button" class="icon-btn" id="logout-btn" aria-label="خروج">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 5.5H7.5A2.5 2.5 0 0 0 5 8v8a2.5 2.5 0 0 0 2.5 2.5H15" /><path d="M13 12h7M17 8.5l3.5 3.5L17 15.5" />
              </svg>
            </button>
          </div>

          <p class="side-note">همه‌چیز روی حساب خودت ذخیره می‌شود.</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="greet">
            <h2 id="greet-title">سلام 👋</h2>
            <p id="today-line"></p>
          </div>
          <div class="top-actions">
            <button type="button" class="btn primary" data-act="nav" data-tab="finance">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5.5v13M5.5 12h13" />
              </svg>
              افزودن تراکنش
            </button>
            <button type="button" class="btn ghost" data-act="sync">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 13.6-5.6L20 9" /><path d="M20 4.5V9h-4.5" />
                <path d="M20 12a8 8 0 0 1-13.6 5.6L4 15" /><path d="M4 19.5V15h4.5" />
              </svg>
              همگام‌سازی
            </button>
            <button type="button" class="icon-btn bell" data-act="nav" data-tab="daily" aria-label="یادآوری‌ها">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 3.6 1.2 5 1.8 5.6H4.7c.6-.6 1.8-2 1.8-5.6Z" />
                <path d="M10 19a2.2 2.2 0 0 0 4 0" />
              </svg>
              <span class="bell-badge" id="bell-count" hidden></span>
            </button>
          </div>
        </header>

        <div id="view"></div>
      </main>
    </div>

    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div class="gate" id="gate" hidden>
      <form class="gate-card" id="gate-form" autocomplete="on">
        <span class="logo gate-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H18a2 2 0 0 1 2 2v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17Z" />
            <path d="M4 9.5h13.5a1.5 1.5 0 0 1 1.5 1.5v4.5" />
          </svg>
        </span>
        <h2>ورود به کارگاه</h2>
        <p class="muted">با یک حساب، پول و کارهایت روی هر دستگاهی در دسترس است.</p>

        <label class="gate-field">
          <span>ایمیل</span>
          <input id="gate-email" type="email" dir="ltr" required autocomplete="email" />
        </label>

        <label class="gate-field">
          <span>گذرواژه</span>
          <input id="gate-pass" type="password" dir="ltr" required minlength="6" autocomplete="current-password" />
        </label>

        <p class="gate-error" id="gate-error" hidden></p>

        <div class="gate-actions">
          <button type="submit" class="btn primary">ورود</button>
          <button type="button" class="btn ghost" id="gate-signup">ساخت حساب</button>
        </div>

        <button type="button" class="link-btn gate-skip" id="gate-skip">
          بدون حساب ادامه بده (فقط همین دستگاه)
        </button>
      </form>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
